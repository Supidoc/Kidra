# nginx reverse proxy for Kidra (LAN/VPN only).
# Include in the http {} context, e.g. /etc/nginx/conf.d/kidra.conf, and adjust
# server_name, certificates and the upstream address (kidra-prod VM, port 8090).

upstream kidra {
    server kidra-prod:8090;
    keepalive 16;
}

# WebSocket-safe Connection header (Kidra itself uses SSE, not WebSockets).
map $http_upgrade $kidra_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name kidra.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kidra.lan;

    ssl_certificate     /etc/nginx/tls/kidra.lan.crt;
    ssl_certificate_key /etc/nginx/tls/kidra.lan.key;

    # Uploads (datasheets, 3D models, library files).
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $kidra_connection;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_request_buffering off;

    # PocketBase realtime (Server-Sent Events): no buffering, long-lived.
    location /api/realtime {
        proxy_pass http://kidra;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # KiCad HTTP library API (used by KiCad itself).
    location /kicad-api/ {
        proxy_pass http://kidra;
    }

    location / {
        proxy_pass http://kidra;
    }
}
